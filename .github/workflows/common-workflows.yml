name: Call common Workflows

on:
  push:
    branches: [ "main", "master" ]

permissions:
  contents: write
  models: read
  packages: write

jobs:
  update-readme:
    uses: nesso-labs/nesso-ci-workflows/.github/workflows/reusable-update-readme.yml@main

  # ─────────────────────────────────────────────────────────────────────────────
  # Container build + k3s deploy — OPT-IN. Set both `build_enabled` to true once
  # this repo really has a Dockerfile at its root and manifests under
  # k8s/<environment>/.
  #
  # Off by default because this template serves every kind of repo, not only
  # container apps. While it defaulted to on, the reusable workflow's Dockerfile
  # check hard-failed on every push and left the repo permanently red — which is
  # what happened to this template itself and to four repos generated from it
  # (nesso-infra, eu-credit-corpus, nesso-tylum-fe, nesso-content-sdk). A
  # chronically red main is worse than no pipeline: it hides the failures that
  # matter.
  #
  # Keeping it off also stops `secrets: inherit` from handing a live cluster
  # kubeconfig to a repo that never deploys.
  # ─────────────────────────────────────────────────────────────────────────────
  build-deploy-staging:
    uses: nesso-labs/nesso-ci-workflows/.github/workflows/reusable-build-deploy.yml@main
    with:
      environment: staging
      namespace: ${{ github.event.repository.name }}
      build_enabled: false
    secrets: inherit

  build-deploy-prod:
    uses: nesso-labs/nesso-ci-workflows/.github/workflows/reusable-build-deploy.yml@main
    with:
      environment: production
      namespace: ${{ github.event.repository.name }}
      build_enabled: false
    secrets: inherit
