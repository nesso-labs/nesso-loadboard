name: Check k8s-bases sync

# WS1 (kill copy-from drift): nesso-k8s-bases/ here must stay a forwarding
# shim pointing at the canonical nesso-k8s-template repo, pinned to an
# explicit tag. This fails the build the moment someone re-vendors a local
# copy or lets the pin float - see scripts/check_k8s_bases_sync.py and
# nesso-k8s-bases/README.md.

on:
  push:
    branches: ["main", "master"]
    paths:
      - "nesso-k8s-bases/**"
      - "scripts/check_k8s_bases_sync.py"
  pull_request:
    paths:
      - "nesso-k8s-bases/**"
      - "scripts/check_k8s_bases_sync.py"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run k8s-bases sync check
        run: python3 scripts/check_k8s_bases_sync.py
